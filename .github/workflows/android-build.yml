name: Build Android APK

# Builds a debug APK that wraps the deployed web app (filmybase.vercel.app)
# in a native Android shell via Capacitor. No local Android Studio/SDK is
# needed to trigger this — it runs entirely on GitHub's runners. Trigger it
# manually from the Actions tab (workflow_dispatch), or it runs automatically
# whenever anything under app/frontend/android changes.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "app/frontend/android/**"
      - "app/frontend/capacitor.config.json"
      - ".github/workflows/android-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # No separate Android SDK setup step: ubuntu-latest runners already
      # ship a preinstalled SDK (ANDROID_HOME set), and the Gradle build
      # below pulls whatever platform/build-tools it needs on its own.
      # android-actions/setup-android@v3 was here before but is broken as
      # of late 2026 — it unconditionally runs `sdkmanager tools`, a legacy
      # package Google has fully removed from its SDK repository.

      # Capacitor's own .gitignore excludes android/app/src/main/assets/public
      # (the copied web bundle) — it's meant to be regenerated from a fresh
      # build, not committed, so CI rebuilds it here before Gradle packages it.
      - name: Install frontend deps and build web assets
        working-directory: app/frontend
        run: |
          npm ci
          npm run build

      - name: Sync web assets into Android project
        working-directory: app/frontend
        run: npx cap sync android

      - name: Make gradlew executable
        working-directory: app/frontend/android
        run: chmod +x ./gradlew

      - name: Build debug APK
        working-directory: app/frontend/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: filmybase-debug-apk
          path: app/frontend/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
